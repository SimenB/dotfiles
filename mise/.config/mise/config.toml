[settings]
self_update.auto = true
tool_update.global_auto = true

idiomatic_version_file_enable_tools = ["go", "java", "node" ,"npm", "pnpm", "python", "ruby", "ruff", "rust", "yarn"]

github.credential_command = "gh auth token"

dotfiles.root = "~/repos/dotfiles"

[bootstrap]
dotfile_groups = ["bat", "functions", "ghostty", "git", "gpg", "iterm2", "karabiner", "mise", "mise-work", "mr", "nano", "ripgrep", "scripts", "tmux", "urxvt", "vim", "zellij", "zsh"]

[bootstrap.repos]
"~/.oh-my-zsh" = { url = "https://github.com/ohmyzsh/ohmyzsh.git" }
"~/.oh-my-zsh/custom/plugins/alias-tips" = { url = "git@github.com:djui/alias-tips" }
"~/.oh-my-zsh/custom/plugins/zsh-completions" = { url = "git@github.com:zsh-users/zsh-completions" }
"~/.tmux/plugins/tpm" = { url = "git@github.com:tmux-plugins/tpm" }
"~/.zsh/zsh-autosuggestions" = { url = "git@github.com:zsh-users/zsh-autosuggestions" }
"~/.zsh/zsh-history-substring-search" = { url = "git@github.com:zsh-users/zsh-history-substring-search" }
"~/.zsh/zsh-syntax-highlighting" = { url = "git@github.com:zsh-users/zsh-syntax-highlighting.git" }

[bootstrap.mise_shell_activate]
zsh = true

[dotfile_groups.iterm2]
root = "iterm2"
mode = "copy"

[dotfile_groups.karabiner]
root = "karabiner"
mode = "copy"

[dotfile_groups.mise-work]
root = "~/repos/dotfiles-work/mise"

[dotfiles]
"~/.config/starship.toml" = { source = "~/repos/dotfiles/starship/.config/starship.toml", mode = "template" }

[bootstrap.brew]
adopt = true
homebrew_metadata = true

[bootstrap.brew.taps]
"browsh-org/browsh" = "https://github.com/browsh-org/homebrew-browsh.git"
"dtan4/dtan4" = "https://github.com/dtan4/homebrew-dtan4.git"
"gromgit/fuse" = "https://github.com/gromgit/homebrew-fuse.git"

